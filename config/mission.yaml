# SafeExec V1 MissionSpec
# 实验室样本运输场景

schema_version: "safeexec.mission.v1"
mission_id: "mission-lab-sample-transfer-001"
principal_id: "lab-agent-01"
valid_from_ms: 1700000000000
valid_until_ms: 1900000000000

grants:
  # Grant 1: sample-A → analyzer-01
  - grant_id: "grant-sample-a-analysis"
    action: "lab.sample.transfer"
    resource:
      type: "lab.sample"
      id: "sample-A"
    arguments:
      source: "cold-storage"
      destination: "analyzer-01"
    required_facts:
      - key: "camera.healthy"
        equals: true
        max_age_ms: 1500

  # Grant 2: sample-B → analyzer-01
  - grant_id: "grant-sample-b-analysis"
    action: "lab.sample.transfer"
    resource:
      type: "lab.sample"
      id: "sample-B"
    arguments:
      source: "cold-storage"
      destination: "analyzer-01"
    required_facts:
      - key: "camera.healthy"
        equals: true
        max_age_ms: 1500

  # Grant 3: sample-A → waste-bin
  - grant_id: "grant-sample-a-disposal"
    action: "lab.sample.transfer"
    resource:
      type: "lab.sample"
      id: "sample-A"
    arguments:
      source: "analyzer-01"
      destination: "waste-bin"
    required_facts:
      - key: "camera.healthy"
        equals: true
        max_age_ms: 1500

  # Grant 4: sample-B → waste-bin
  - grant_id: "grant-sample-b-disposal"
    action: "lab.sample.transfer"
    resource:
      type: "lab.sample"
      id: "sample-B"
    arguments:
      source: "analyzer-01"
      destination: "waste-bin"
    required_facts:
      - key: "camera.healthy"
        equals: true
        max_age_ms: 1500

  # Grant 5: sample-A → quarantine-zone
  - grant_id: "grant-sample-a-quarantine"
    action: "lab.sample.transfer"
    resource:
      type: "lab.sample"
      id: "sample-A"
    arguments:
      source: "cold-storage"
      destination: "quarantine-zone"
    required_facts:
      - key: "camera.healthy"
        equals: true
        max_age_ms: 1500

  # Grant 6: sample-B → quarantine-zone
  - grant_id: "grant-sample-b-quarantine"
    action: "lab.sample.transfer"
    resource:
      type: "lab.sample"
      id: "sample-B"
    arguments:
      source: "cold-storage"
      destination: "quarantine-zone"
    required_facts:
      - key: "camera.healthy"
        equals: true
        max_age_ms: 1500
