# SafeExec V2 MissionSpec — autonomous BioLab line.

schema_version: "safeexec.mission.v1"
mission_id: "mission-biolab-autonomous-line-002"
principal_id: "lab-agent-01"
valid_from_ms: 1700000000000
valid_until_ms: 1900000000000

grants:
  - grant_id: "grant-sample-a-analysis"
    action: "lab.sample.transfer"
    resource: {type: "lab.sample", id: "sample-A"}
    arguments: {source: "cold-storage", destination: "analyzer-01"}
    required_facts: &camera_fact
      - {key: "camera.healthy", equals: true, max_age_ms: 1500}

  - grant_id: "grant-sample-b-analysis"
    action: "lab.sample.transfer"
    resource: {type: "lab.sample", id: "sample-B"}
    arguments: {source: "cold-storage", destination: "analyzer-01"}
    required_facts: *camera_fact

  - grant_id: "grant-sample-c-analysis"
    action: "lab.sample.transfer"
    resource: {type: "lab.sample", id: "sample-C"}
    arguments: {source: "cold-storage", destination: "analyzer-01"}
    required_facts: *camera_fact

  - grant_id: "grant-sample-d-analysis"
    action: "lab.sample.transfer"
    resource: {type: "lab.sample", id: "sample-D"}
    arguments: {source: "cold-storage", destination: "analyzer-01"}
    required_facts: *camera_fact

  - grant_id: "grant-sample-e-analysis"
    action: "lab.sample.transfer"
    resource: {type: "lab.sample", id: "sample-E"}
    arguments: {source: "cold-storage", destination: "analyzer-01"}
    required_facts: *camera_fact

  - grant_id: "grant-sample-f-analysis"
    action: "lab.sample.transfer"
    resource: {type: "lab.sample", id: "sample-F"}
    arguments: {source: "cold-storage", destination: "analyzer-01"}
    required_facts: *camera_fact

  # Entity-pool maintenance is a first-class physical action. It is signed,
  # one-shot leased, and Guard-verified instead of bypassing SafeExec.
  - grant_id: "grant-sample-a-recycle"
    action: "lab.sample.recycle"
    resource: {type: "lab.sample", id: "sample-A"}
    arguments: {source: "analyzer-01", destination: "cold-storage"}
    required_facts: []

  - grant_id: "grant-sample-b-recycle"
    action: "lab.sample.recycle"
    resource: {type: "lab.sample", id: "sample-B"}
    arguments: {source: "analyzer-01", destination: "cold-storage"}
    required_facts: []

  - grant_id: "grant-sample-c-recycle"
    action: "lab.sample.recycle"
    resource: {type: "lab.sample", id: "sample-C"}
    arguments: {source: "analyzer-01", destination: "cold-storage"}
    required_facts: []

  - grant_id: "grant-sample-d-recycle"
    action: "lab.sample.recycle"
    resource: {type: "lab.sample", id: "sample-D"}
    arguments: {source: "analyzer-01", destination: "cold-storage"}
    required_facts: []

  - grant_id: "grant-sample-e-recycle"
    action: "lab.sample.recycle"
    resource: {type: "lab.sample", id: "sample-E"}
    arguments: {source: "analyzer-01", destination: "cold-storage"}
    required_facts: []

  - grant_id: "grant-sample-f-recycle"
    action: "lab.sample.recycle"
    resource: {type: "lab.sample", id: "sample-F"}
    arguments: {source: "analyzer-01", destination: "cold-storage"}
    required_facts: []

  - grant_id: "grant-line-reset"
    action: "lab.line.reset"
    resource: {type: "lab.line", id: "biolab-line-01"}
    arguments: {command: "reset"}
    required_facts: []
